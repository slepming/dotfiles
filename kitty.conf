# FONT
font_size 10
fore_ltr yes
disable_ligatures always
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

# CURSOR
## CURSOR_TRAIL
cursor_trail 1
cursor_trail_color #FFDFA6

# MOUSE
mouse_hide_wait 3.0


# SCREEN UPDATE
sync_to_monitor yes

# TAB BAR
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{title:.20}"
active_tab_title_template "I LIKE LINUX"
tab_bar_background none
active_tab_foreground   #FFDFA6
active_tab_background   #1C1C1C
active_tab_font_style   bold-italic
inactive_tab_foreground #999
inactive_tab_background #1C1C1C
inactive_tab_font_style normal

# COLOR SCHEME
foreground #FFFFFF
background #232323
background_opacity 0.9

# SELECTION
selection_foreground #FFDFA6
selection_background #1C1C1C

# NOTIFY
notify_on_cmd_finish unfocused 5.0 command hyprctl notify 1 2000 "rgb(FFDFA6)" "Command executed: %s" %c




