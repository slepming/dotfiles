# Wallpaper directory in $HOME/Wallpapers
$mainMod = SUPER
$mainExt = SUPER ALT
$mainSt = SUPER SHIFT

$imageViewer = vulkan_zero

$apps = rofi -show drun
$browser = firefox

exec-once = hyprctl setcursor Notwaita-Gray 24

# execr = hyprpaper & ~/.local/share/eww/eww open -c /mnt/Programming/Projects/yuck/main_bar topbar
exec-once = /usr/bin/quickshell
exec = hyprpaper

# FOR PC
monitor = DP-1, 1920x1080@180.00, 0x0, 1
# FOR LAPTOP
monitor = HDMI-A-1,1920x1080@120.00, 1920x0, 1

gesture = 3, vertical, workspace

# -------------------------------- SOURCES --------------------------------
source = options.conf
source = input.conf
source = windowrules.conf
