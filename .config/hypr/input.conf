bind = $mainMod, space, exec, $apps
bind = $mainExt, f, exec, $browser
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive
bind = $mainMod, F, togglefloating,
bind = $mainSt, F, fullscreen

bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r

bind = $mainExt, N, cyclenext, none

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hyprlock
bind = $mainSt CTRL, L, exec, hyprlock

# Screenshot
bind = $mainMod, S, exec, hyprshot -m region -- $imageViewer
bind = $mainSt, S, exec, hyprshot -m output -m active -- $imageViewer

bind = $mainMod, Tab, workspace,previous

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, Z, togglespecialworkspace, telegram
bind = $mainMod, X, togglespecialworkspace, spec

bind = $mainMod CTRL, 1, workspace, 11
bind = $mainMod CTRL, 2, workspace, 12
bind = $mainMod CTRL, 3, workspace, 13
bind = $mainMod CTRL, 4, workspace, 14
bind = $mainMod CTRL, 5, workspace, 15
bind = $mainMod CTRL, 6, workspace, 16
bind = $mainMod CTRL, 7, workspace, 17
bind = $mainMod CTRL, 8, workspace, 18
bind = $mainMod CTRL, 9, workspace, 19
bind = $mainMod CTRL, 0, workspace, 20


# move window
bind = $mainSt, H, movewindow, l
bind = $mainSt, L, movewindow, r
bind = $mainSt, J, movewindow, d
bind = $mainSt, K, movewindow, u

bind = $mainMod CTRL, H, movetoworkspace, -1
bind = $mainMod CTRL, L, movetoworkspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainSt, 1, movetoworkspace, 1
bind = $mainSt, 2, movetoworkspace, 2
bind = $mainSt, 3, movetoworkspace, 3
bind = $mainSt, 4, movetoworkspace, 4
bind = $mainSt, 5, movetoworkspace, 5
bind = $mainSt, 6, movetoworkspace, 6
bind = $mainSt, 7, movetoworkspace, 7
bind = $mainSt, 8, movetoworkspace, 8
bind = $mainSt, 9, movetoworkspace, 9
bind = $mainSt, 0, movetoworkspace, 10

bind = $mainExt, H, resizeactive, -10% 0
bind = $mainExt, J, resizeactive, 0 10%
bind = $mainExt, K, resizeactive, 0 -10%
bind = $mainExt, L, resizeactive, 10% 0

bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 11
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 12
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 13
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 14
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 15
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 16
bind = $mainMod CTRL SHIFT, 7, movetoworkspace, 17
bind = $mainMod CTRL SHIFT, 8, movetoworkspace, 18
bind = $mainMod CTRL SHIFT, 9, movetoworkspace, 19
bind = $mainMod CTRL SHIFT, 0, movetoworkspace, 20

bind = $mainExt, S, movetoworkspace, special:spec

bind = $mainMod CTRL, P, exec, hyprpicker | wl-copy

# Disable second monitor
bind = $mainSt CTRL, D, exec, hyprctl keyword monitor "DVI-D-1, disabled"

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bind = $mainSt, O, global, quickshell:openMedia
